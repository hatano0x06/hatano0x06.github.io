<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焼肉駆動開発 - 鋭意開発中</title>
    <!-- Google Fonts の Noto Sans JP を読み込み（太字を美しく見せるため） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --text-main: #ffffff;
            --text-sub: #ffb74d; 
            --glow-color: rgba(255, 87, 34, 0.4);
            --btn-color: #ff5722; /* ボタンのメインカラー */
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 画面中央から広がる炭火のようなグラデーション */
            background: radial-gradient(circle at center, #2c1b18 0%, var(--bg-color) 70%);
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        .title {
            /* 画面サイズに合わせて文字の大きさを可変（最小2.5rem、最大5rem） */
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            margin-bottom: 1.5rem;
            /* 燃えるようなテキストシャドウ */
            text-shadow: 0 4px 20px var(--glow-color);
            opacity: 0;
            transform: translateY(-20px);
            /* 上からふわっと現れるアニメーション */
            animation: fadeInDown 1s ease-out forwards;
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.15em;
            opacity: 0;
            transform: translateY(20px);
            /* タイトルより少し遅れて現れるアニメーション */
            animation: fadeInUp 1s ease-out 0.5s forwards;
        }

        /* サブタイトルの前後に装飾 */
        .subtitle::before, .subtitle::after {
            content: "ー";
            margin: 0 10px;
            opacity: 0.7;
        }

        /* 追加：説明文のデザイン */
        .description {
            font-weight: 400;
            line-height: 1.8;
            margin-bottom: 3rem; /* リンクとの間にスペースを作る */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out 0.6s forwards;
            background: rgba(0, 0, 0, 0.4);
            padding: 1.5rem 2rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .description p {
            margin: 0.8rem 0;
        }

        /* 修正：ゲームリンクを青文字ではなく、目立つボタンに変更 */
        .game-link {
            display: inline-block;
            padding: 1.2rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff !important; /* 青色になるのを強制的に防ぐ */
            text-decoration: none; /* 下線を消す */
            background: var(--btn-color);
            border: 2px solid transparent;
            border-radius: 50px;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out 0.9s forwards;
        }

        .game-link:hover {
            background: #e64a19;
            box-shadow: 0 6px 25px var(--glow-color);
            transform: translateY(-3px) scale(1.02);
        }
        /* 炎の絵文字を少しだけ揺らすアニメーション */
        .emoji-fire {
            display: inline-block;
            animation: flicker 2s infinite alternate;
        }

        .emoji-meat {
            display: inline-block;
            transform: scale(1.1);
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.1) rotate(2deg); filter: drop-shadow(0 0 10px #ff9800); }
            100% { transform: scale(1) rotate(-1deg); }
        }

        /* 控えめな火の粉の背景装飾 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(#ff5722 1px, transparent 1px),
                radial-gradient(#ff9800 1px, transparent 1px);
            background-size: 50px 50px, 100px 100px;
            background-position: 0 0, 25px 25px;
            opacity: 0.08;
            animation: moveParticles 20s linear infinite;
        }

        @keyframes moveParticles {
            from { background-position: 0 0, 25px 25px; }
            to { background-position: 50px -50px, 125px -75px; }
        }
    </style>

</head>
<body>
    <div class="particles"></div>
    <div class="container">
        <div class="title"><span class="emoji-fire">🔥</span>焼肉駆動開発<span class="emoji-meat">🍖</span></div>
        <div class="subtitle">鋭意開発中（冬コミ参加予定）</div>
        <div class="description">
            <p>私たちは独自のアイデアで新しい面白さを追求するインディーゲーム制作サークルです。</p>
        </div>


        <div class="subtitle">開発中ゲーム</div>
        <!-- 追加したゲームへのリンク -->
        <a href="https://hatano0x06.itch.io/sample" target="_blank" rel="noopener noreferrer" class="game-link">
            拡張将棋（仮）をプレイ
        </a>
    </div>

</body>
</html>
